<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:500;src:url(../../www/fonts/inter-tight-500.woff2)}
@font-face{font-family:IT;font-weight:700;src:url(../../www/fonts/inter-tight-700.woff2)}
/* Relay trailer, moving phone (8 Nov, v4). The phone is the site's 3D phone (slabs, rim, insets, the homepage's two angles).
   setT(scene, t) draws one frame; render_anim.js films it at 30 fps. */
:root{--ch:#1C1E22;--cream:#EEE8DC;--amber:#F2B33D}
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--ch);color:var(--cream);font-family:IT,sans-serif;overflow:hidden}
.stage{position:absolute;inset:0;perspective:var(--persp)}
.ph{position:absolute;left:0;top:0;width:var(--pw);aspect-ratio:390/844;border-radius:calc(var(--pw)*.1467);transform-style:preserve-3d;--d:calc(var(--pw)*.117)}
.ph .slab{position:absolute;inset:0;border-radius:inherit;background:#222429;transform:translateZ(calc(var(--k)*var(--d)/-12))}
.ph .slab.rim{background:#34363C}
.ph .scr{position:absolute;inset:calc(var(--pw)*.0333);border-radius:calc(var(--pw)*.1133);overflow:hidden;transform:translateZ(.5px);background:var(--ch)}
.ph .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.say{position:absolute;font:700 var(--sz)/1.04 IT;letter-spacing:-.01em;text-wrap:balance;text-indent:-.42em;padding-left:.42em}
.say span{opacity:0}.say span.on{opacity:1}
.legal{position:absolute;left:var(--g);right:var(--g);bottom:calc(var(--g)*.5);font:500 var(--lg)/1.35 IT;color:var(--cream);letter-spacing:.01em;text-wrap:pretty;text-shadow:0 1px 3px rgba(21,23,28,.85)}
.h{--g:96px;--lg:20px;--pw:430px;--sz:84px;--persp:2000px}
.v{--g:72px;--lg:26px;--pw:540px;--sz:80px;--persp:2500px}
</style></head><body><div class="stage" id="st">
<div class="ph" id="ph"><i class="slab" style="--k:12"></i><i class="slab" style="--k:11"></i><i class="slab" style="--k:10"></i><i class="slab" style="--k:9"></i><i class="slab" style="--k:8"></i><i class="slab" style="--k:7"></i><i class="slab" style="--k:6"></i><i class="slab" style="--k:5"></i><i class="slab" style="--k:4"></i><i class="slab" style="--k:3"></i><i class="slab" style="--k:2"></i><i class="slab rim" style="--k:1"></i>
<div class="scr"><img id="s0" src="phone-home.png"><img id="s1" src="phone-listening.png"><img id="s2" src="phone-answer.png"></div></div>
<div class="say" id="ben"></div><div class="say" id="maya"></div>
<div class="legal">Unofficial companion app. Not affiliated with or endorsed by Embark Studios. ARC Raiders is a trademark of Embark Studios. Maps by MetaForge.</div>
</div>
<script>
const q=new URLSearchParams(location.search), F=q.get('f')||'h', W=F=='h'?1920:1080, H=F=='h'?1080:1920;
document.getElementById('st').classList.add(F);
let T=null; window.TL={};
const R={rx:22,ry:34,rz:-10}, L={rx:22,ry:-34,rz:10};   /* the homepage's finale and hero angles */
const ease=u=>u<=0?0:u>=1?1:u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const mix=(a,b,k)=>a+(b-a)*k, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function words(el,text){el.innerHTML=text.split(' ').map((w,i,a)=>'<span>'+(i==0?'“':'')+w+(i==a.length-1?'”':'')+'</span>').join(' ');}
async function init(){
  T=await (await fetch('audio/timing.json')).json();
  words(document.getElementById('ben'),T.ben.words.map(w=>w[0]).join(' '));
  words(document.getElementById('maya'),T.maya.words.map(w=>w[0]).join(' ').replace('90 metres','90&nbsp;metres'));
  const s=getComputedStyle(document.getElementById('st')), pw=parseFloat(s.getPropertyValue('--pw')), g=parseFloat(s.getPropertyValue('--g'));
  const ph=pw*844/390;
  /* where the phone sits: centre point and scale */
  window.POS=F=='h'
    ? {mid:{x:W/2,y:H/2+40,s:1.35},right:{x:W*.72,y:H/2-20,s:1},left:{x:W*.28,y:H/2-20,s:1}}
    : {mid:{x:W/2,y:H/2+60,s:1.3},right:{x:W/2+60,y:H-ph/2-170,s:1},left:{x:W/2-60,y:ph/2+110,s:1}};
  const ben=document.getElementById('ben'),maya=document.getElementById('maya');
  if(F=='h'){Object.assign(ben.style,{left:g+'px',width:(W/2-g-40)+'px',top:'50%',transform:'translateY(-55%)'});Object.assign(maya.style,{left:(W/2+40)+'px',width:(W/2-g-40)+'px',top:'50%',transform:'translateY(-55%)'});}
  else{Object.assign(ben.style,{left:g+'px',right:g+'px',top:'170px'});Object.assign(maya.style,{left:g+'px',right:g+'px',bottom:'230px'});}
  await document.fonts.ready; await Promise.all([...document.images].map(i=>i.decode()));
  /* timeline of the talk scene, seconds */
  const B0=.8, B1=B0+T.ben.dur, M0=B1+.35, M1=M0+1.0, Y0=M0+.35, Y1=Y0+T.maya.dur, END=Y1+.9;
  window.TL={home:2.6, talk:END, B0, M0, M1, Y0};
  document.body.dataset.ready=1;
}
function place(p,a,k){ /* p: {x,y,s}, a: angle, k: how far into the angle (0 flat) */
  const el=document.getElementById('ph'), s=getComputedStyle(document.getElementById('st')), pw=parseFloat(s.getPropertyValue('--pw')), ph=pw*844/390;
  el.style.transform='translate('+(p.x-pw/2)+'px,'+(p.y-ph/2)+'px) scale('+p.s+') rotateX('+a.rx*k+'deg) rotateY('+a.ry*k+'deg) rotateZ('+a.rz*k+'deg)';
}
function showWords(id,list,t0,t){document.querySelectorAll('#'+id+' span').forEach((sp,i)=>sp.classList.toggle('on',t>=t0+list[i][1]));}
function screen(n,fade){['s0','s1','s2'].forEach((id,i)=>document.getElementById(id).style.opacity=i==n?1:(i==n-1&&fade!=null?1-fade:0));
  if(fade!=null){document.getElementById(['s0','s1','s2'][n]).style.opacity=fade;}}
window.setT=function(scene,t){
  const P=window.POS, TL=window.TL;
  if(scene=='home'){ /* slow push towards the greeting */
    const u=ease(t/TL.home); place({x:P.mid.x,y:P.mid.y,s:mix(1.0,1.12,u)}, R, mix(.55,.8,u)); screen(0);
    showWords('ben',T.ben.words,99,t); showWords('maya',T.maya.words,99,t); return; }
  /* talk: big and near flat, eases out to the right; Ben's words on the left; on Relay's reply the phone crosses
     to the left and turns the other way, the screen changing as it turns; Relay's words on the right */
  const a=ease(clamp(t/.9,0,1));
  let p={x:mix(P.mid.x,P.right.x,a),y:mix(P.mid.y,P.right.y,a),s:mix(P.mid.s,1,a)}, ang=R, k=mix(.2,1,a);
  const m=clamp((t-TL.M0)/(TL.M1-TL.M0),0,1), e=ease(m);
  if(m>0){ p={x:mix(P.right.x,P.left.x,e),y:mix(P.right.y,P.left.y,e),s:1+.06*Math.sin(Math.PI*e)};
    const ry=mix(R.ry,L.ry,e), rz=mix(R.rz,L.rz,e); ang={rx:22,ry,rz}; k=1; }
  place(p,ang,k);
  if(m<=0) screen(1); else if(m>=1) screen(2); else { const f=clamp((e-.35)/.3,0,1); screen(2,f); }
  showWords('ben',T.ben.words,TL.B0,t);
  showWords('maya',T.maya.words,TL.Y0,t);
  document.getElementById('ben').style.opacity=m>0?1-clamp(m*3,0,1):1;
};
init();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:500;src:url(../../www/fonts/inter-tight-500.woff2)}
@font-face{font-family:IT;font-weight:700;src:url(../../www/fonts/inter-tight-700.woff2)}
/* Relay trailer B, type-led (8 Nov): big words as they're spoken. Ben asks, a hard cut to the phone (nearly flat, cropped,
   two beats on the music's drop), then Relay's answer in the same big type. End: the folio lockup with the address under it
   (see lockup.html). setT(scene, t) draws a frame. ?alpha=1 draws on a clear background, for words over game footage. */
:root{--ch:#1C1E22;--cream:#EEE8DC;--amber:#F2B33D}
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--ch);}
html.alpha,html.alpha body{background:transparent}
html,body{color:var(--cream);font-family:IT,sans-serif;overflow:hidden}
.stage{position:absolute;inset:0;perspective:var(--persp)}
.game{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 35%,#4a4f48 0%,#2c302d 45%,#17191b 100%)}
.game::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 42px)}
.game .tag{position:absolute;left:var(--g);top:var(--g);font:500 26px/1.3 IT;color:rgba(238,232,220,.55)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.1)}  /* B1: a flat 10% black over the whole frame (Tony, 8 Nov) */
.scrim.blue{background:rgba(21,23,28,.85)}                       /* B2: ink at 85% over greyscale footage (darkened from 72%, Tony 8 Nov) (greyscale done in make_b.py) */
.ph.flat{transform:none!important}
.url2{position:absolute;font:700 var(--url2)/1 IT;color:var(--cream);letter-spacing:.01em;white-space:nowrap}
.fade{opacity:0}
.badge{position:absolute;right:80px;bottom:64px;height:84px;width:282px;border-radius:12px;border:2px dashed rgba(238,232,220,.6);display:flex;align-items:center;justify-content:center;font:500 20px IT;color:rgba(238,232,220,.8)}
.badge img{position:absolute;height:125px;width:auto;right:-21px;top:-21px}  /* Google's generic PNG has padding: 125 px tall shows an 84 px badge */
.legal.end{right:calc(80px + 282px + 48px)}
.ph{position:absolute;left:0;top:0;width:var(--pw);aspect-ratio:390/844;border-radius:calc(var(--pw)*.1467);transform-style:preserve-3d;--d:calc(var(--pw)*.117);z-index:3}
.ph .slab{position:absolute;inset:0;border-radius:inherit;background:#222429;transform:translateZ(calc(var(--k)*var(--d)/-12))}
.ph .slab.rim{background:#34363C}
.ph .scr{position:absolute;inset:calc(var(--pw)*.0333);border-radius:calc(var(--pw)*.1133);overflow:hidden;transform:translateZ(.5px);background:var(--ch)}
.ph .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.t{position:absolute;left:var(--tg);font:700 var(--big)/.98 IT;letter-spacing:-.02em;text-wrap:balance}
.t span{opacity:0}.t span.on{opacity:1}
.t.hey{font-size:var(--hey)}
.t.mid{font-size:var(--mid);line-height:1}
.lock svg{position:absolute;overflow:hidden}
.lock path{fill:none;stroke:var(--amber);stroke-width:10}
.lock .w{position:absolute;font-weight:700;color:var(--cream);white-space:nowrap;line-height:1}
.legal{position:absolute;z-index:5;left:var(--g);right:var(--g);bottom:calc(var(--g)*.5);font:500 var(--lg)/1.35 IT;color:var(--cream);letter-spacing:.01em;text-wrap:pretty;text-shadow:0 1px 3px rgba(21,23,28,.85)}
.h{--g:96px;--tg:120px;--lg:20px;--pw:430px;--persp:2000px;--big:200px;--mid:120px;--mk:98px;--bigph:640px;--hey:320px;--url2:64px;--endph:400px}
.v{--g:72px;--tg:72px;--lg:26px;--pw:520px;--persp:2500px;--big:130px;--mid:104px;--mk:110px;--bigph:980px;--hey:208px;--url2:56px;--endph:440px}
</style></head><body><div class="stage" id="st"></div>
<script>
const q=new URLSearchParams(location.search), F=q.get('f')||'h', W=F=='h'?1920:1080, H=F=='h'?1080:1920, st=document.getElementById('st');
st.classList.add(F); if(q.get('alpha')) document.documentElement.classList.add('alpha');
const ease=u=>u<=0?0:u>=1?1:u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, mix=(a,b,k)=>a+(b-a)*k, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ARCS=['M -10 12 H 14 A 46 46 0 0 1 60 58 V 82','M -10 28 H 14 A 30 30 0 0 1 44 58 V 82','M -10 44 H 14 A 14 14 0 0 1 28 58 V 82'];
const ONR={rx:22,ry:-34,rz:10};
let T, CV={}, built='';
const sp=(text,cls)=>'<div class="t '+(cls||'')+'">'+text.split(' ').map(w=>'<span>'+w+'</span>').join(' ')+'</div>';
const phoneHTML='<div class="ph" id="ph">'+Array.from({length:12},(_,k)=>'<i class="slab'+(k==11?' rim':'')+'" style="--k:'+(12-k)+'"></i>').join('')+'<div class="scr"><img src="phone-answer.png"></div></div>';
const LEGAL='Unofficial companion app. Not affiliated with or endorsed by Embark Studios. ARC Raiders is a trademark of Embark Studios. Maps by MetaForge.';
const legal='<div class="legal">'+LEGAL+'</div>';
/* the store badge and Google's trademark line, as on Sniff's end card. Placeholder until Google's badge file is in tools/trailer/ */
const BADGE='<div class="badge fade" id="badge">Google Play badge</div>', legalEnd='<div class="legal end">'+LEGAL+' Google Play and the Google Play logo are trademarks of Google LLC.</div>';
const flatPhone=()=>'<div class="ph flat" id="ph" style="--pw:var(--endph)"><div class="slab rim" style="--k:1"></div><div class="scr"><img src="phone-answer.png"></div></div>';
/* every block of words (question, answer, Ask. Find. Get out.) shares one size and one top-left point (Tony, 8 Nov):
   the biggest size where each block fits between the side margins without breaking a line it shouldn't, and the
   tallest block fits the frame; the blocks then all start where the tallest one, centred, would. */
const ANSWER=()=>sp(T.maya.words.map(w=>w[0]).join(' ')).replace('<span>90</span> <span>metres</span> <span>west.</span>','<span>90</span>&nbsp;<span>metres</span>&nbsp;<span>west.</span>');
const AFG=()=>sp('Ask. Find. Get out.').replace(/<\/span> <span>/g,'</span><br><span>').replace('<br><span>out.','&nbsp;<span>out.');
let TOP=0;
/* optical left edges (Tony, 8 Nov): the legal line and the address start where the big words' first letter starts.
   inkL(text, font) = how far the first letter's ink sits right of where the text box starts */
const CV2=document.createElement('canvas').getContext('2d');
const INK={};  /* measured by drawing the letter and finding its first inked column (the browser's glyph metrics were unreliable) */
const inkL=(txt,font)=>{const k=txt[0]+'|'+font; if(k in INK) return INK[k];
  const c=document.createElement('canvas'); c.width=c.height=600; const x=c.getContext('2d'); x.font=font; x.textBaseline='top'; x.fillStyle='#000'; x.fillText(txt[0],100,100);
  const d=x.getImageData(0,0,600,600).data; let m=600; for(let i=3;i<d.length;i+=4) if(d[i]>110){const col=((i-3)/4)%600; if(col<m) m=col;}
  return INK[k]=m-100;};
function alignLeft(scene){
  const tg=parseFloat(getComputedStyle(st).getPropertyValue('--tg')), big=parseFloat(getComputedStyle(st).getPropertyValue('--big'));
  const t=st.querySelector('.t'), size=t?parseFloat(getComputedStyle(t).fontSize):big;
  /* the block's leftmost ink: the first letter of every line (Village and the sit further left than I'm) */
  let starts=['I','V','t','R'];   /* the question's line starts, for scenes with no big words */
  if(t){ starts=[]; let top=null; t.querySelectorAll('span').forEach(w=>{const y=Math.round(w.getBoundingClientRect().top); if(y!==top){starts.push(w.textContent.trim()[0]); top=y;}}); }
  /* every block's leftmost ink sits exactly on the margin line, so the cards (and Hey Relay) share one left edge */
  const x=tg; if(t) t.style.left=(tg-Math.min(...starts.map(c=>inkL(c,'700 '+size+'px IT'))))+'px';
  const lg=st.querySelector('.legal'); if(lg){const fs=getComputedStyle(lg).fontSize; lg.style.left=(x-inkL(LEGAL,'500 '+fs+' IT'))+'px';}
  return x;
}
function fitType(){
  const blocks=[sp(T.ask.words.map(w=>w[0]).join(' ')),ANSWER(),AFG()], maxH=F=='h'?H-240:H*.62;
  for(let px=F=='h'?300:240;px>=60;px-=2){
    st.style.setProperty('--big',px+'px'); st.innerHTML=blocks.join('');
    const ts=[...st.querySelectorAll('.t')]; ts.forEach(t=>{t.style.right='var(--tg)';t.style.top='0';});
    const edge=W-parseFloat(getComputedStyle(st).getPropertyValue('--tg'));  /* every word's own right edge inside the margin */
    const lines=t=>new Set([...t.querySelectorAll('span')].map(w=>Math.round(w.getBoundingClientRect().top))).size;
    /* two-line rule (Tony, 8 Nov): the question and the answer are never more than two lines; Ask. Find. Get out. is three by design */
    const ok=ts.every((t,i)=>[...t.querySelectorAll('span')].every(w=>w.getBoundingClientRect().right<=edge)&&t.getBoundingClientRect().height<=maxH&&(i==2||lines(t)<=2));
    if(ok){ TOP=Math.round((H-Math.max(...ts.map(t=>t.getBoundingClientRect().height)))/2); window.BIG=px; break; }
  }
  st.innerHTML=''; built='';
}
async function init(){
  T=await (await fetch('audio/timing.json')).json();
  await document.fonts.load('700 100px IT'); await document.fonts.load('500 20px IT'); await document.fonts.ready; fitType();
  document.body.dataset.ready=1;
}

function build(scene){ if(built==scene) return; built=scene;
  const words=k=>T[k].words.map(w=>w[0]).join(' ');
  if(scene=='hey') st.innerHTML=sp('Hey Relay','hey')+legal;
  if(scene=='ask') st.innerHTML=sp(words('ask'))+legal;
  if(scene=='phone') st.innerHTML=phoneHTML+legal;
  if(scene=='answer') st.innerHTML=ANSWER()+legal;  /* one span per spoken word; 90 metres west. never splits */
  if(scene=='afg') st.innerHTML='<div class="scrim"></div>'+AFG()+legal;
  if(scene=='afg2') st.innerHTML='<div class="scrim blue"></div>'+AFG()+flatPhone()+'<div class="url2 fade" id="url2">getarcrelay.app</div>'+legal;
  if(scene=='legal') st.innerHTML=legal;
  if(scene=='end') st.innerHTML='<div class="lock"><svg viewBox="0 0 72 72">'+ARCS.map(d=>'<path d="'+d+'" pathLength="1" stroke-dasharray="1"/>').join('')+'</svg><div class="w nm">RELAY</div><div class="w url">getarcrelay.app</div></div>'+BADGE+legalEnd;
  const ts=st.querySelectorAll('.t');
  ts.forEach(t=>{ t.style.right='var(--tg)';
    if(t.classList.contains('hey')){t.style.top='50%';t.style.transform=F=='h'?'translateY(-52%)':'translateY(-60%)';} else t.style.top=(scene=='afg2'&&F=='v'?200:TOP)+'px'; });  /* 9:16 B2: words up top, the phone under them */
  if(scene=='phone'){ const el=document.getElementById('ph'); el.style.setProperty('--pw',getComputedStyle(st).getPropertyValue('--bigph')); }
  if(scene=='end') layLock();
  window.INKX=alignLeft(scene);
}
function show(el,list,t0,t){el.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('on',t>=t0+list[i][1]));}
function place(p,a){const el=document.getElementById('ph'),pw=parseFloat(getComputedStyle(el).getPropertyValue('--pw')),ph=pw*844/390;
  el.style.transform='translate('+(p.x-pw/2)+'px,'+(p.y-ph/2)+'px) scale('+p.s+') rotateX('+a.rx+'deg) rotateY('+a.ry+'deg) rotateZ('+a.rz+'deg)';}
/* the folio lockup, as in lockup.html: V the visible mark (the lines fill 65 of 72 units), caps 0.58 V centred on it,
   gap 0.52 V, RELAY 2.55 V wide (+4%), the address as wide as RELAY and 0.32 of the cap height under it */
let LK=null;
function layLock(){
  const c=document.createElement('canvas').getContext('2d');
  const M=(t,px,ls)=>{c.font='700 '+px+'px IT';c.letterSpacing=(ls||0)+'px';const m=c.measureText(t);return {w:m.actualBoundingBoxLeft+m.actualBoundingBoxRight,l:m.actualBoundingBoxLeft,a:m.actualBoundingBoxAscent,d:m.actualBoundingBoxDescent,fa:m.fontBoundingBoxAscent,fd:m.fontBoundingBoxDescent};};
  const mk=parseFloat(getComputedStyle(st).getPropertyValue('--mk')), cap=mk*.58, ns=cap/(M('RELAY',100).a/100);
  const ls=(mk*2.55-M('RELAY',ns).w)/4, nw=mk*2.55; let us=100; us=us*nw/M('getarcrelay.app',us).w; const U=M('getarcrelay.app',us);
  const capTop=(mk-cap)/2, uTop=capTop+cap+cap*.32, totalH=Math.max(mk,uTop+U.a+U.d), gap=mk*.52, totalW=mk+gap+nw;
  const x0=Math.round((W-totalW)/2), y0=Math.round((H-totalH)/2), box=mk*72/65;
  const put=(el,px,lsp,inkTop,m)=>{el.style.fontSize=px+'px';el.style.letterSpacing=lsp+'px';const half=(px-(m.fa+m.fd))/2;el.style.left=(x0+mk+gap+m.l)+'px';el.style.top=(y0+inkTop-(half+m.fa-m.a))+'px';};
  put(st.querySelector('.lock .nm'),ns,ls,capTop,M('RELAY',ns,ls)); put(st.querySelector('.lock .url'),us,0,uTop,U);
  const svg=st.querySelector('.lock svg'); Object.assign(svg.style,{width:box+'px',height:box+'px',top:(y0-box*7/72)+'px'});
  LK={centre:(W-mk)/2, left:x0};
}
/* scene lengths (s). phone: two beats of the music (72 bpm), hard cut in on the drop and out on the beat */
window.TL={hey:2.2, ask:2.2, phone:1.66, answer:3.3, afg:2.3, afg2:6.2, legal:1/30, end:4.4, V:{hey:.25, ask:.25, maya:.2, afg:-.07, url:1.25, url2:2.4},
  AF:{ask:.2, find:.9, out:1.6, url:2.4}};  /* B2 end frame beats (Tony, 8 Nov): Ask. with the phone / Find. / Get out. / the address; then a hold */  /* afg -0.07: Ask is heard as the overlay finishes fading in (0.2 s) */
window.setT=function(scene,t){
  build(scene); const V=TL.V, ts=st.querySelectorAll('.t');
  if(scene=='hey') show(ts[0],T.hey.words,V.hey,t);
  if(scene=='ask') show(ts[0],T.ask.words,V.ask,t);
  if(scene=='afg') ts[0].querySelectorAll('span').forEach(s=>s.classList.add('on'));  /* B1: all at once, with the overlay */
  if(scene=='afg2'){ const A=TL.AF; show(ts[0],[['Ask.',A.ask],['Find.',A.find],['Get',A.out],['out.',A.out]],0,t);  /* Ask. / Find. / Get out. with a beat between */ st.querySelector('.scrim').style.opacity=clamp(t/.2,0,1); }  /* B2: word by word with Maya, punchy */
  if(scene=='afg2'){ /* B2 end frame: the phone straight on at the right, then the address under the words; 0.2 s fades */
    const ph=document.getElementById('ph'), pw=parseFloat(getComputedStyle(ph).getPropertyValue('--pw')), phH=pw*844/390, u=document.getElementById('url2'), tb=ts[0].getBoundingClientRect();
    if(F=='h'){ ph.style.left=(W-150-pw)+'px'; ph.style.top=((H-phH)/2-30)+'px'; } else { ph.style.left=((W-pw)/2)+'px'; ph.style.top=(H-phH-200)+'px'; }
    ph.style.opacity=t>=TL.AF.ask?1:0;   /* the phone snaps in with Ask. */
    const us=parseFloat(getComputedStyle(st).getPropertyValue('--url2'));
    u.style.left=(INKX-inkL('getarcrelay.app','700 '+us+'px IT'))+'px'; u.style.top=(tb.bottom+us*.6)+'px'; u.style.opacity=t>=TL.AF.url?1:0; }  /* the address snaps in as Maya says it */
  if(scene=='answer') show(ts[0],T.maya.words,V.maya,t);
  if(scene=='phone'){ /* nearly flat and big, cropped by the frame: the answer's headline and the map, a slow push in */
    const pw=parseFloat(getComputedStyle(st).getPropertyValue('--bigph')), k=t/TL.phone;
    const ph=pw*844/390; /* 16:9: top of the phone 56 px down, so the headline, map and route show and the mic is cropped */
    place(F=='h'?{x:W*.5,y:56+ph/2,s:1+.03*k}:{x:W*.5,y:H*.5+ph*.12,s:1+.03*k},{rx:6,ry:-5+1.5*k,rz:1.5}); }
  if(scene=='end'){ /* the mark draws in the middle, slides left, then RELAY and the address appear beside it */
    const draw=clamp(t/.45,0,1), mv=ease(clamp((t-.6)/.5,0,1));
    st.querySelectorAll('.lock path').forEach((p,i)=>p.setAttribute('stroke-dashoffset',Math.max(0,1-clamp(draw*1.5-i*.25,0,1))));
    st.querySelector('.lock svg').style.left=mix(LK.centre,LK.left,mv)+'px';
    st.querySelectorAll('.lock .w').forEach(w=>w.style.opacity=ease(clamp((t-1.0)/.5,0,1))); document.getElementById('badge').style.opacity=clamp((t-1.0)/.2,0,1); }  /* fades in as the mark settles */
};
init();
</script></body></html>

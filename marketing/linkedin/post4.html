<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:700;src:url(inter-tight-700.woff2)}
html,body{margin:0;background:#1C1E22}
.fg{position:relative;width:4800px;height:2508px;overflow:hidden;background:#1C1E22;color:#EEE8DC;display:flex;align-items:center}
.fg h2{margin:0 0 0 384px;font:700 448px/1.02 IT;letter-spacing:-.01em;white-space:pre-line}
.fg .stage{position:absolute;left:3360px;top:50%;perspective:6560px;transform:translate(-50%,-50%)}
.p3{--pw:960px;--d:112px;position:relative;width:var(--pw);aspect-ratio:390/844;border-radius:calc(var(--pw) * .1467);transform-style:preserve-3d;transform:rotateX(22deg) rotateY(-34deg) rotateZ(10deg)}
.p3 i{position:absolute;inset:0;border-radius:inherit;background:#222429;transform:translateZ(calc(var(--k) * var(--d) / -12))}
.p3 i.rim{background:#34363C}
.p3 .scr{position:absolute;inset:calc(var(--pw) * .0333);border-radius:calc(var(--pw) * .1133);overflow:hidden;transform:translateZ(.5px)}
.p3 .scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
</style>
<div class="fg" id="fg"><h2>Ten voices.
Zero cost.</h2><div class="stage"><div class="p3"><i style="--k:12"></i><i style="--k:11"></i><i style="--k:10"></i><i style="--k:9"></i><i style="--k:8"></i><i style="--k:7"></i><i style="--k:6"></i><i style="--k:5"></i><i style="--k:4"></i><i style="--k:3"></i><i style="--k:2"></i><i class="rim" style="--k:1"></i><div class="scr"><img src="ob-voice.png" alt=""></div></div></div></div>
